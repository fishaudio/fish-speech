name: fish-speech

services:
  server:
    extends:
      file: compose.base.yml
      service: app-base
    build:
      target: server
    environment:
      COMPILE: ${COMPILE:-0}
      LLAMA_CHECKPOINT_PATH: ${LLAMA_CHECKPOINT_PATH:-}
      HF_MODEL: ${HF_MODEL:-fishaudio/s2-pro}
      HF_REVISION: ${HF_REVISION:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      DECODER_CHECKPOINT_PATH: ${DECODER_CHECKPOINT_PATH:-}
      # e.g. cuda:0 to keep Drama 3 on one GPU; unset uses up to four
      DEVICE: ${DEVICE:-}
    profiles: ["server"]
    ports:
      - "${API_PORT:-8080}:8080"
